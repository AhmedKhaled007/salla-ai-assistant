services:
  # MCP Server - Salla API integration
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    env_file:
      - ./mcp-server/.env
    networks:
      - salla-network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./mcp-server/src:/app/src
    command: [ "python", "-m", "mcp_server.main", "--transport", "http" ]

  # Agent Service - LLM + MCP Client
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      - PHOENIX_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_BASE_URL=http://phoenix:6006
      - PHOENIX_PROJECT_NAME=salla-agent-dev
      - PHOENIX_PROTOCOL=http/protobuf
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - agent-conversations:/app/conversations
      - ./agent/src:/app/src
      - ./agent/evals:/app/evals:ro
    depends_on:
      - mcp-server
      - db
    networks:
      - salla-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  eval:
    profiles:
      - eval
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - ./agent/.env
    environment:
      - ENVIRONMENT=development
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      - PHOENIX_ENABLED=true
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_BASE_URL=http://phoenix:6006
      - PHOENIX_PROJECT_NAME=salla-agent-eval
      - PHOENIX_PROTOCOL=http/protobuf
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    entrypoint: [ "python", "-m", "evals.run" ]
    depends_on:
      mcp-server:
        condition: service_started
      phoenix:
        condition: service_healthy
    volumes:
      - ./agent/evals:/app/evals:ro
    networks:
      - salla-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: salla_user
      POSTGRES_PASSWORD: salla_password
      POSTGRES_DB: salla_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - salla-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U salla_user -d salla_agent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend - React/Vite UI (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite requires env vars at build time
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"

    networks:
      - salla-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:version-19.13.0
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    ports:
      - "6006:6006"  # UI and OTLP HTTP collector
      - "4317:4317"  # OTLP gRPC collector
    volumes:
      - phoenix_data:/mnt/data
    networks:
      - salla-network
    restart: unless-stopped


networks:
  salla-network:
    driver: bridge

volumes:
  agent-conversations:
  phoenix_data:
  postgres_data:

# Docker Compose for Salla Agent Full Stack
# Usage: docker-compose up -d

version: '3.8'

services:
  # MCP Server - Salla API integration
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    env_file:
      - ./mcp-server/.env
    networks:
      - salla-network
    restart: unless-stopped

  # Agent Service - LLM + MCP Client
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env
    volumes:
      - agent-conversations:/app/conversations
    depends_on:
      - mcp-server
    networks:
      - salla-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend - React/Vite UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - agent
    networks:
      - salla-network
    restart: unless-stopped

networks:
  salla-network:
    driver: bridge

volumes:
  agent-conversations:

services:
  # MCP Server - Salla API integration
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    env_file:
      - ./mcp-server/.env
    networks:
      - salla-network
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./mcp-server/src:/app/src
    command: [ "python", "-m", "mcp_server.main", "--transport", "http" ]

  # Agent Service - LLM + MCP Client
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env
    environment:
      - ENVIRONMENT=development
      - API_HOST=0.0.0.0
      - MCP_SERVER_URL=http://mcp-server:8001/mcp
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - agent-conversations:/app/conversations
      - ./agent/src:/app/src
    depends_on:
      - mcp-server
      - db
    networks:
      - salla-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: salla_user
      POSTGRES_PASSWORD: salla_password
      POSTGRES_DB: salla_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - salla-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U salla_user -d salla_agent" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend - React/Vite UI (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite requires env vars at build time
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "3020:3000"

    networks:
      - salla-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  salla-network:
    driver: bridge

volumes:
  agent-conversations:
  postgres_data:
